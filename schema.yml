components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
      required:
      - id
      - name
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        thumbnail:
          type: string
          format: uri
          nullable: true
        instructor:
          type: integer
          readOnly: true
        instructor_details:
          allOf:
          - $ref: '#/components/schemas/UserProfile'
          readOnly: true
        category:
          type: integer
          nullable: true
        category_details:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        is_published:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
      required:
      - category_details
      - created_at
      - description
      - id
      - instructor
      - instructor_details
      - title
    CourseDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        thumbnail:
          type: string
          format: uri
          nullable: true
        instructor:
          type: integer
          readOnly: true
        instructor_details:
          allOf:
          - $ref: '#/components/schemas/UserProfile'
          readOnly: true
        category:
          type: integer
          nullable: true
        category_details:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        is_published:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
        sections:
          type: array
          items:
            $ref: '#/components/schemas/CourseSection'
          readOnly: true
      required:
      - category_details
      - created_at
      - description
      - id
      - instructor
      - instructor_details
      - sections
      - title
    CourseEnrollment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
          readOnly: true
        course:
          allOf:
          - $ref: '#/components/schemas/Course'
          readOnly: true
        enrolled_at:
          type: string
          format: date-time
          readOnly: true
        progress_percentage:
          type: number
          format: double
          readOnly: true
        is_completed:
          type: boolean
          readOnly: true
      required:
      - course
      - enrolled_at
      - id
      - is_completed
      - progress_percentage
      - student
    CourseSection:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
          readOnly: true
        title:
          type: string
          maxLength: 255
        order:
          type: integer
        course:
          type: integer
      required:
      - course
      - id
      - lessons
      - title
    Lesson:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        content:
          type: string
          description: Rich text content (HTML/JSON)
        order:
          type: integer
        section:
          type: integer
      required:
      - id
      - section
      - title
    LevelEnum:
      enum:
      - '100'
      - '200'
      - '300'
      - '400'
      - '500'
      type: string
      description: |-
        * `100` - 100 Level
        * `200` - 200 Level
        * `300` - 300 Level
        * `400` - 400 Level
        * `500` - 500 Level
    PaginatedCategoryList:
      type: object
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedCourseEnrollmentList:
      type: object
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CourseEnrollment'
    PaginatedCourseList:
      type: object
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Course'
    PaginatedCourseSectionList:
      type: object
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CourseSection'
    PaginatedLessonList:
      type: object
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
    PatchedCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
    PatchedCourse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        thumbnail:
          type: string
          format: uri
          nullable: true
        instructor:
          type: integer
          readOnly: true
        instructor_details:
          allOf:
          - $ref: '#/components/schemas/UserProfile'
          readOnly: true
        category:
          type: integer
          nullable: true
        category_details:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        is_published:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
    PatchedCourseSection:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
          readOnly: true
        title:
          type: string
          maxLength: 255
        order:
          type: integer
        course:
          type: integer
    PatchedLesson:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        content:
          type: string
          description: Rich text content (HTML/JSON)
        order:
          type: integer
        section:
          type: integer
    RoleEnum:
      enum:
      - STUDENT
      - INSTRUCTOR
      - ADMIN
      type: string
      description: |-
        * `STUDENT` - Student
        * `INSTRUCTOR` - Instructor
        * `ADMIN` - Admin
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          readOnly: true
        phone_number:
          type: string
          maxLength: 20
        university:
          type: string
          maxLength: 255
        department:
          type: string
          maxLength: 255
        level:
          oneOf:
          - $ref: '#/components/schemas/LevelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        bio:
          type: string
          nullable: true
        avatar:
          type: string
          format: uri
          nullable: true
        is_verified:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - full_name
      - id
      - is_verified
      - role
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
